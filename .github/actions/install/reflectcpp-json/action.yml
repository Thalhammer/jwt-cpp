name: Install reflect-cpp
description: Install reflect-cpp for building test application
inputs:
  version:
    description: The desired reflect-cpp version to install
    required: false
    default: "0.27.1"
runs:
  using: composite
  steps:
    - run: '"$GITHUB_ACTION_PATH/install-reflect-cpp.sh" "$VERSION" --prefix "$RUNNER_TEMP/jwt-cpp-deps" --jobs "$(nproc)"'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
