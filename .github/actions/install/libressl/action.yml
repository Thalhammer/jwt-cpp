name: Install LibreSSL
description: Install and setup LibreSSL for linking and building test application
inputs:
  version:
    description: The desired LibreSSL version to install
    required: false
    default: "4.4.1"
runs:
  using: composite
  steps:
    - run: '"$GITHUB_ACTION_PATH/install-libressl.sh" "$VERSION" --prefix "$RUNNER_TEMP/jwt-cpp-deps" --jobs "$(nproc)"'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
