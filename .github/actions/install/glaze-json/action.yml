name: Install Glaze
description: Install Glaze for building test application
inputs:
  version:
    description: The desired Glaze version to install
    required: false
    default: "9.1.0"
runs:
  using: composite
  steps:
    - run: '"$GITHUB_ACTION_PATH/install-glaze.sh" "$VERSION" --prefix "$RUNNER_TEMP/jwt-cpp-deps" --jobs "$(nproc)"'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
