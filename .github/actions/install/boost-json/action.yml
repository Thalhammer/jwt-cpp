name: Install Boost.JSON
description: Install Boost.JSON for building test application
inputs:
  version:
    description: The desired Boost.JSON version to install
    required: false
    default: "1.92.0"
runs:
  using: composite
  steps:
    - run: '"$GITHUB_ACTION_PATH/install-boost-json.sh" "$VERSION" --prefix "$RUNNER_TEMP/jwt-cpp-deps" --jobs "$(nproc)"'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
