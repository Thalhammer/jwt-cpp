name: Install PicoJSON
description: Install PicoJSON for building test application
inputs:
  version:
    description: The desired PicoJSON version to install
    required: false
    default: "v1.3.0"
runs:
  using: composite
  steps:
    - run: '"$GITHUB_ACTION_PATH/install-picojson.sh" "$VERSION" --prefix "$RUNNER_TEMP/jwt-cpp-deps" --jobs "$(nproc)"'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
