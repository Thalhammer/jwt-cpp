name: Install GTest
description: Install and setup GTest for linking and building test application
inputs:
  version:
    description: The desired GTest version to install
    required: false
    default: "1.17.0"
runs:
  using: composite
  steps:
    - run: '"$GITHUB_ACTION_PATH/install-gtest.sh" "$VERSION" --prefix "$RUNNER_TEMP/jwt-cpp-deps" --jobs "$(nproc)"'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
