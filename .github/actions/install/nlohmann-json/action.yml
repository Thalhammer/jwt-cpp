name: Install nlohmann-json
description: Install nlohmann-json for building test application
inputs:
  version:
    description: The desired nlohmann-json version to install
    required: false
    default: "3.12.0"
runs:
  using: composite
  steps:
    - run: '"$GITHUB_ACTION_PATH/install-nlohmann-json.sh" "$VERSION" --prefix "$RUNNER_TEMP/jwt-cpp-deps" --jobs "$(nproc)"'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
