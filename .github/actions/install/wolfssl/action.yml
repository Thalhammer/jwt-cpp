name: Install wolfSSL
description: Install and setup wolfSSL for linking and building test application
inputs:
  version:
    description: The desired stable wolfSSL version to install
    required: false
    default: "v5.9.4-stable"
runs:
  using: composite
  steps:
    - run: '"$GITHUB_ACTION_PATH/install-wolfssl.sh" "$VERSION" --prefix "$RUNNER_TEMP/jwt-cpp-deps" --jobs "$(nproc)"'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
