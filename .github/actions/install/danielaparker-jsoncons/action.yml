name: Install jsoncons
description: Install jsoncons for building test application
inputs:
  version:
    description: The desired jsoncons version to install
    required: false
    default: "1.10.0"
runs:
  using: composite
  steps:
    - run: '"$GITHUB_ACTION_PATH/install-jsoncons.sh" "$VERSION" --prefix "$RUNNER_TEMP/jwt-cpp-deps" --jobs "$(nproc)"'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
